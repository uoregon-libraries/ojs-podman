# Don't let public uploads be executed as PHP
<Directory /var/www/html/public>
    AllowOverride None
    <FilesMatch "(?i)\.(php|php3|phtml)$">
        Order deny,allow
        Deny from all
    </FilesMatch>
</Directory>

# This won't exist in production setups, but for testing it's a useful way to
# review email validity. This only works if you have the smtpdebug app running
# alongside the other services, and configured OJS to use it.
Alias /smtp-debug-logs /var/local/smtp-debug-logs
<Directory /var/local/smtp-debug-logs>
    AllowOverride None
    Options +Indexes
    Require all granted
</Directory>
