# Don't let public uploads be executed as PHP
<Directory /var/www/html/public>
    AllowOverride None
    <FilesMatch "(?i)\.(php|php3|phtml)$">
        Order deny,allow
        Deny from all
    </FilesMatch>

    # OJS writes an author's cover image here as soon as it's attached, with no
    # editorial review and no check that it's an image (HTML, JS, PDF, etc. are
    # all kept as-is). Spammers use this to host pages on our domain, so only
    # serve cover images with an image extension. Extensionless files are still
    # served, since OJS doesn't know how to name some real images (e.g., AVIF).
    <FilesMatch "(?i)^submission_\d+_\d+_coverImage_[^.]+\.(?!(gif|jpe?g|png|webp)$)">
        Order deny,allow
        Deny from all
    </FilesMatch>

    # Don't let browsers guess that an untyped file (like the above
    # extensionless images) is a web page
    Header set X-Content-Type-Options "nosniff"
</Directory>
