# This is a basic example of combining OJS, DB, proxy, and smtpdebug services'
# definitions. Copy this to `compose.yml`, copy `.env.example` to `.env` and
# edit it, copy `compose.override-example.yml` to `compose.override.yml`, edit
# it, and go.
#
# Your compose.yml is meant to define the services you use, the override
# configures how podman sets up and exposes those services, and `.env`
# configures the running containers' applications.
include:
  - ojs.compose.yml
  - db.compose.yml
  - proxy.compose.yml
  - smtpdebug.compose.yml
  # If you use podman-compose, you may need to specify this explicitly.
  # podman-compose does load this, but it appears to load the override *first*,
  # causing various settings to get overridden (like volumes).
  #- compose.override.yml
