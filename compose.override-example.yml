# Example overrides for a basic setup.
#
# Overrides are only for structural changes: basically just published ports and
# volume redefinitions. The stack is set up by choosing which files to include
# in compose.yml, and settings that vary per environment (URLs, passwords, TPS
# keys) go in `.env`; see `compose-example.yml` and `.env.example`.
services:
  # Expose "proxy" to the host. In dev, the port should match
  # PUBLIC_PORT_SUFFIX in `.env`.
  proxy:
    ports:
      - 8080:80

  # Uncomment below to mount a DB dump for importing and/or expose the db to
  # the host. Don't use these in prod long-term!
  #db:
  #  ports:
  #    - "127.0.0.1:3306:3306"
  #  volumes:
  #    - ./exports/db:/docker-entrypoint-initdb.d

