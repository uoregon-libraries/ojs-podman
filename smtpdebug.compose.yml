services:
  smtpdebug:
    build:
      context: .
      dockerfile: Dockerfile-smtpdebug
    volumes:
      - smtp-debug-logs:/var/local/smtp-debug-logs:rw
    logging:
      driver: k8s-file
      options:
        path: ${CONTAINER_LOG_DIR:?CONTAINER_LOG_DIR must be set}/smtpdebug.log
    restart: always

  # Caddy serves the captured emails at /smtp-debug-logs/
  proxy:
    volumes:
      - smtp-debug-logs:/var/local/smtp-debug-logs:ro

volumes:
  smtp-debug-logs: {}
