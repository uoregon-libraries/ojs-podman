services:
  smtpdebug:
    build:
      context: .
      dockerfile: Dockerfile-smtpdebug
    volumes:
      - smtp-debug-logs:/var/local/smtp-debug-logs:rw

  # Caddy serves the captured emails at /smtp-debug-logs/
  proxy:
    volumes:
      - smtp-debug-logs:/var/local/smtp-debug-logs:ro

volumes:
  smtp-debug-logs: {}
